<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主观题批改实验平台</title>
<style>
:root {
  --primary: #4a6cf7; --primary-light: #eef2ff; --success: #10b981; --success-light: #ecfdf5;
  --danger: #ef4444; --danger-light: #fef2f2; --warning: #f59e0b; --warning-light: #fffbeb;
  --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0; --gray-300: #cbd5e1;
  --gray-500: #64748b; --gray-700: #334155; --gray-900: #0f172a;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.5; }
#app { max-width: 1440px; margin: 0 auto; min-height: 100vh; }
header { background: linear-gradient(135deg, #4a6cf7, #6366f1); color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 20px; font-weight: 600; }
header span { font-size: 13px; opacity: .8; }
.server-status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.server-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.server-status .dot.on { background: #34d399; }
.server-status .dot.off { background: #f87171; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
nav { background: #fff; border-bottom: 1px solid var(--gray-200); display: flex; padding: 0 24px; overflow-x: auto; }
nav button { padding: 12px 20px; border: none; background: none; cursor: pointer; font-size: 14px; color: var(--gray-500); border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap; }
nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }
nav button:hover { color: var(--primary); }
main { padding: 20px 24px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .15s; font-weight: 500; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #3b5de7; }
.btn-primary:disabled { background: var(--gray-300); cursor: not-allowed; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: #fff; color: var(--gray-700); border: 1px solid var(--gray-300); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="text"], input[type="number"], input[type="password"], select, textarea {
  padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 13px;
  font-family: inherit; outline: none; transition: border-color .15s; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 100px; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--gray-700); }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-row > div { flex: 1; }
.form-group { margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--gray-200); }
th { background: var(--gray-50); font-weight: 600; font-size: 12px; color: var(--gray-700); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.table-wrap { overflow: auto; max-height: 520px; border: 1px solid var(--gray-200); border-radius: var(--radius); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.badge-success { background: var(--success-light); color: var(--success); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-warning { background: var(--warning-light); color: #b45309; }
.badge-primary { background: var(--primary-light); color: var(--primary); }
.badge-gray { background: var(--gray-100); color: var(--gray-500); }
.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-item { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 18px; display: flex; flex-direction: column; }
.stat-item .label { font-size: 12px; color: var(--gray-500); }
.stat-item .value { font-size: 20px; font-weight: 700; color: var(--gray-900); }
.progress-bar { background: var(--gray-200); border-radius: 10px; height: 20px; overflow: hidden; position: relative; }
.progress-bar .fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width .3s; }
.progress-bar .text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--gray-700); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.model-card, .prompt-card { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.model-card h4, .prompt-card h4 { font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.model-card p, .prompt-card p { font-size: 12px; color: var(--gray-500); margin-bottom: 8px; word-break: break-all; }
.matrix-table th.diag { background: var(--gray-100); }
.matrix-table td { text-align: center; vertical-align: middle; }
.matrix-table td.correct { background: var(--success-light); color: var(--success); font-weight: 600; }
.matrix-table td.wrong { background: var(--danger-light); color: var(--danger); font-weight: 600; cursor: pointer; }
.matrix-table td.pending { background: var(--gray-100); color: var(--gray-500); }
td.truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; background: var(--danger-light); color: var(--danger); padding: 1px 6px; border-radius: 4px; font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray-500); padding: 4px 8px; }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }
/* Toast */
#toast-container { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: 8px; font-size: 13px; color: #fff; animation: slideIn .2s; max-width: 360px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--primary); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.log-entry { padding: 8px 12px; border-bottom: 1px solid var(--gray-100); font-size: 12px; font-family: 'SF Mono', Menlo, monospace; }
.log-entry .time { color: var(--gray-500); margin-right: 8px; }
.log-entry.info .msg { color: var(--gray-700); }
.log-entry.error .msg { color: var(--danger); }
.log-entry.warn .msg { color: #b45309; }
.log-entry.success .msg { color: var(--success); }
.filter-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.filter-bar select { width: auto; min-width: 120px; }
.empty-state { text-align: center; padding: 40px; color: var(--gray-500); }
.empty-state p { margin-bottom: 12px; }
.accuracy-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.accuracy-bar .bar { flex: 1; height: 24px; background: var(--gray-200); border-radius: 4px; overflow: hidden; position: relative; }
.accuracy-bar .bar .fill { height: 100%; border-radius: 4px; transition: width .3s; }
.accuracy-bar .pct { font-weight: 600; font-size: 14px; min-width: 50px; text-align: right; }
.accuracy-bar .lbl { font-size: 13px; min-width: 120px; }
.section-title { font-size: 14px; font-weight: 600; margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--gray-200); }
.detail-view { font-size: 12px; }
.detail-view dt { font-weight: 600; color: var(--gray-700); margin-top: 8px; }
.detail-view dd { color: var(--gray-500); margin-left: 0; white-space: pre-wrap; word-break: break-word; background: var(--gray-50); padding: 8px; border-radius: 4px; margin-top: 4px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>主观题批改实验平台</h1>
    <span>模型 &times; Prompt 横评测试工具</span>
    <div class="server-status" id="server-status"><span class="dot off"></span><span>代理服务未连接</span></div>
  </header>
  <nav id="nav">
    <button class="active" onclick="switchTab('data')">数据管理</button>
    <button onclick="switchTab('config')">实验配置</button>
    <button onclick="switchTab('experiment')">运行实验</button>
    <button onclick="switchTab('results')">结果分析</button>
    <button onclick="switchTab('logs')">日志系统</button>
  </nav>
  <main>
    <!-- ===== 数据管理 ===== -->
    <section id="tab-data" class="tab-panel active">
      <div class="card">
        <div class="card-title">加载测试数据</div>
        <div class="btn-group">
          <label class="btn btn-primary" style="cursor:pointer;">
            上传题目数据CSV
            <input type="file" accept=".csv" onchange="handleCSVUpload(event)" style="display:none">
          </label>
          <button class="btn btn-outline" onclick="loadSampleData()">使用示例数据</button>
        </div>
        <p style="margin-top:8px;font-size:12px;color:var(--gray-500);">上传「模型&prompt横评测试集 - 数学.csv」主表文件</p>
      </div>
      <div id="data-stats" class="stats-bar" style="display:none;"></div>
      <div id="data-filter" class="card" style="display:none;">
        <div class="filter-bar">
          <label style="margin:0;">试卷:</label>
          <select id="filter-paper" onchange="renderDataTable()"><option value="">全部</option></select>
          <label style="margin:0;">题型:</label>
          <select id="filter-type" onchange="renderDataTable()"><option value="">全部</option></select>
          <label style="margin:0;">正误:</label>
          <select id="filter-right" onchange="renderDataTable()">
            <option value="">全部</option><option value="TRUE">正确</option><option value="FALSE">错误</option>
          </select>
          <span id="data-count" style="font-size:12px;color:var(--gray-500);"></span>
        </div>
      </div>
      <div id="data-table-wrap" class="table-wrap" style="display:none;">
        <table id="data-table">
          <thead><tr>
            <th>#</th><th>试卷</th><th>题号</th><th>题型</th><th>题目</th>
            <th>用户答案</th><th>正确答案</th><th>是否正确</th>
          </tr></thead>
          <tbody id="data-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== 实验配置 ===== -->
    <section id="tab-config" class="tab-panel">
      <div class="grid-2">
        <div>
          <div class="card">
            <div class="card-title">模型配置 <button class="btn btn-sm btn-primary" onclick="showModelModal()">+ 添加模型</button></div>
            <div id="models-list"></div>
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-title">Prompt配置
              <button class="btn btn-sm btn-primary" onclick="showPromptModal()">+ 添加</button>
              <label class="btn btn-sm btn-outline" style="cursor:pointer;">
                上传文件
                <input type="file" accept=".txt,.md,.prompt" multiple onchange="handlePromptUpload(event)" style="display:none">
              </label>
            </div>
            <div id="prompts-list"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">题型 &rarr; Prompt类型映射</div>
        <p style="font-size:12px;color:var(--gray-500);margin-bottom:10px;">决定每种题型使用哪类prompt进行评测。judge: 判题prompt; subjective: 分步批改prompt</p>
        <div id="type-mapping" class="form-row"></div>
        <button class="btn btn-sm btn-primary" onclick="saveTypeMapping()" style="margin-top:8px;">保存映射</button>
      </div>
    </section>

    <!-- ===== 运行实验 ===== -->
    <section id="tab-experiment" class="tab-panel">
      <div class="card">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
          <span>选择实验组合</span>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-sm btn-primary" onclick="toggleComboAll(true)">全选</button>
            <button class="btn btn-sm" onclick="toggleComboAll(false)">全不选</button>
          </div>
        </div>
        <p style="font-size:12px;color:var(--gray-500);margin-bottom:12px;">勾选需要测试的 模型&times;Prompt 组合，系统会根据题型映射自动匹配</p>
        <div class="table-wrap" style="max-height:none;">
          <table class="matrix-table" id="combo-matrix">
            <thead id="combo-thead"></thead>
            <tbody id="combo-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">运行设置</div>
        <div class="form-row">
          <div class="form-group">
            <label>最大并发数</label>
            <input type="number" id="run-concurrency" value="4" min="1" max="20">
          </div>
          <div class="form-group">
            <label>请求延迟 (ms)</label>
            <input type="number" id="run-delay" value="500" min="0" step="100">
          </div>
          <div class="form-group">
            <label>单次超时 (ms)</label>
            <input type="number" id="run-timeout" value="60000" min="5000" step="5000">
          </div>
          <div class="form-group">
            <label>失败重试次数</label>
            <input type="number" id="run-retry" value="1" min="0" max="5">
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-success" id="btn-run" onclick="startExperiment()">开始运行</button>
          <button class="btn btn-danger" id="btn-stop" onclick="stopExperiment()" disabled>停止</button>
        </div>
      </div>
      <div class="card" id="progress-card" style="display:none;">
        <div class="card-title">运行进度</div>
        <div class="progress-bar"><div class="fill" id="progress-fill" style="width:0"></div><div class="text" id="progress-text">0%</div></div>
        <p id="progress-detail" style="margin-top:8px;font-size:12px;color:var(--gray-500);"></p>
      </div>
    </section>

    <!-- ===== 结果分析 ===== -->
    <section id="tab-results" class="tab-panel">
      <div class="btn-group" style="margin-bottom:16px;">
        <button class="btn btn-primary" onclick="exportResultsCSV()">导出结果CSV</button>
        <button class="btn btn-outline" onclick="exportResultsJSON()">导出JSON</button>
        <button class="btn btn-outline" onclick="exportSummaryCSV()">导出总结表CSV</button>
        <button class="btn btn-danger" onclick="clearResults()">清除所有结果</button>
      </div>
      <div id="results-stats" class="stats-bar"></div>
      <div class="card">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
          <span>详细结果表</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <label style="font-size:13px;color:var(--gray-500);">Prompt筛选：</label>
            <select id="results-prompt-filter" onchange="renderResultsTable()" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
              <option value="__all__">全部</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="matrix-table" id="results-table">
            <thead id="results-thead"></thead>
            <tbody id="results-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">按模型统计</div>
          <div id="stats-by-model"></div>
        </div>
        <div class="card">
          <div class="card-title">按Prompt统计</div>
          <div id="stats-by-prompt"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">按题型统计</div>
        <div id="stats-by-type"></div>
      </div>
    </section>

    <!-- ===== 日志系统 ===== -->
    <section id="tab-logs" class="tab-panel">
      <div class="btn-group" style="margin-bottom:12px;">
        <button class="btn btn-outline" onclick="exportLogs()">导出日志</button>
        <button class="btn btn-danger btn-sm" onclick="clearLogs()">清除日志</button>
      </div>
      <div class="filter-bar">
        <select id="log-filter-level" onchange="renderLogs()">
          <option value="">全部级别</option><option value="info">Info</option>
          <option value="success">Success</option><option value="warn">Warning</option><option value="error">Error</option>
        </select>
        <input type="text" id="log-search" placeholder="搜索日志..." oninput="renderLogs()" style="width:240px;">
      </div>
      <div class="table-wrap" style="max-height:600px;">
        <div id="logs-container"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)hideModal()">
  <div class="modal">
    <div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="toast-container"></div>

<script>
// ===== Constants =====
const STORAGE_KEY = 'grading_exp_tool';
const TYPE_MAP_DEFAULT = { '选择题':'judge','填空题':'judge','解答题':'subjective','计算题':'subjective','综合题':'subjective' };
const PROMPT_TYPE_LABELS = { judge:'判题(judge)', subjective:'分步批改(subjective)' };
const PROVIDER_PRESETS = {
  qwen:     { label: '通义千问 (DashScope)', url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions' },
  deepseek: { label: 'DeepSeek',             url: 'https://api.deepseek.com/v1/chat/completions' },
  doubao:   { label: '豆包 (火山引擎)',        url: 'https://ark.cn-beijing.volces.com/api/v3/chat/completions' },
  openai:   { label: 'OpenAI',               url: 'https://api.openai.com/v1/chat/completions' },
};
const MODEL_TEMPLATES = [
  { name: 'Qwen3.6-Plus',  provider: 'qwen',     modelId: 'qwen3.6-plus',  desc: '千问3.6旗舰，Agentic Coding强' },
  { name: 'Qwen3.5-Plus',  provider: 'qwen',     modelId: 'qwen3.5-plus',  desc: '千问3.5，速度快成本低' },
  { name: 'DeepSeek-V4-Pro',   provider: 'deepseek', modelId: 'deepseek-v4-pro',   desc: 'DeepSeek V4 Pro，编程数学强' },
  { name: 'DeepSeek-V4-Flash', provider: 'deepseek', modelId: 'deepseek-v4-flash', desc: 'DeepSeek V4 Flash，高速低成本' },
  { name: 'Doubao-2.0-Pro',  provider: 'doubao', modelId: 'doubao-2.0-pro',  desc: '豆包2.0 Pro（需填接入点ID）' },
  { name: 'Doubao-2.0-Lite', provider: 'doubao', modelId: 'doubao-2.0-lite', desc: '豆包2.0 Lite（需填接入点ID）' },
];

// ===== State =====
let state = {
  questions: [],
  models: [],
  prompts: [],
  results: [],
  logs: [],
  typeMap: { ...TYPE_MAP_DEFAULT },
  running: false
};

// ===== Persistence =====
async function saveConfig() {
  try {
    const payload = { models: state.models, prompts: state.prompts, typeMap: state.typeMap };
    await fetch('/api/save-config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  } catch(e) { /* fallback to localStorage */ try { localStorage.setItem(STORAGE_KEY+'_cfg', JSON.stringify({models:state.models,prompts:state.prompts,typeMap:state.typeMap})); } catch(e2){} }
}
async function saveResults() {
  try {
    await fetch('/api/save-results', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(state.results) });
  } catch(e) {}
}
function saveState() { saveConfig(); saveResults(); }

async function loadSavedState() {
  let configLoaded = false;
  let resultsLoaded = false;
  // Try server file first
  try {
    const [cfgResp, resResp] = await Promise.all([
      fetch('/api/load-config').then(r => r.json()),
      fetch('/api/load-results').then(r => r.json())
    ]);
    if (cfgResp.exists && cfgResp.data) {
      state.models = (cfgResp.data.models || []).map(m => {
        if (!m.apiKeys && m.apiKey) m.apiKeys = [m.apiKey];
        if (!m.apiKeys) m.apiKeys = [];
        return m;
      });
      state.prompts = cfgResp.data.prompts || [];
      state.typeMap = cfgResp.data.typeMap || { ...TYPE_MAP_DEFAULT };
      configLoaded = true;
    }
    if (resResp.exists && resResp.data) {
      state.results = Array.isArray(resResp.data) ? resResp.data : [];
      resultsLoaded = true;
    }
  } catch(e) {
    // Server not available, try localStorage fallback
  }
  // Fallback to localStorage if server failed
  if (!configLoaded) {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY + '_cfg'));
      if (s) { state.models = (s.models || []).map(m => { if (!m.apiKeys && m.apiKey) m.apiKeys = [m.apiKey]; if (!m.apiKeys) m.apiKeys = []; return m; }); state.prompts = s.prompts || []; state.typeMap = s.typeMap || { ...TYPE_MAP_DEFAULT }; }
    } catch(e){}
  }
  if (!resultsLoaded) {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY + '_res'));
      if (s) state.results = s;
    } catch(e){}
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function now() { return new Date().toLocaleString('zh-CN', { hour12: false }); }

// ===== Prompt Builder =====
// Resolve various placeholder formats ({{XXX}}, {xxx}) and append data when no placeholders exist
function buildPromptContent(rawPrompt, question) {
  const q = question;
  const vals = {
    question: q.question || '', user_answer: q.user_answer || '',
    user_final_answer: q.user_final_answer || '', right_answer: q.right_answer || '',
    final_right_answer: q.final_right_answer || '', question_type: q.question_type || '',
    subject: '数学'
  };
  // Placeholder name (lowercase) → data key
  const keyMap = {
    'question_content': 'question', 'question': 'question',
    'student_answer': 'user_answer', 'user_answer': 'user_answer', 'user_final_answer': 'user_final_answer',
    'standard_answer': 'final_right_answer', 'right_answer': 'final_right_answer',
    'final_right_answer': 'final_right_answer', 'reference': 'final_right_answer',
    'question_type': 'question_type', 'subject': 'subject'
  };
  // Extract prompt text if wrapped in JSON (e.g. {"prompt_template": "...", ...})
  let prompt = rawPrompt;
  try {
    const parsed = JSON.parse(rawPrompt);
    if (parsed.prompt_template) prompt = parsed.prompt_template;
  } catch(e) {}

  let result = prompt, hasPlaceholder = false;
  // Replace {{KEY}} and {key} for known placeholder names
  result = result.replace(/\{\{?([A-Za-z_]+)\}?\}/g, (match, name) => {
    const key = name.toLowerCase();
    if (keyMap[key] !== undefined) { hasPlaceholder = true; return vals[keyMap[key]]; }
    return match; // Keep LaTeX / chemical formulas / JSON braces as-is
  });
  // If prompt has no known placeholders, append question data at the end
  if (!hasPlaceholder) {
    result += `\n\n【题目】：${vals.question}\n【标准答案】：${vals.final_right_answer}\n【学生答案】：${vals.user_answer}`;
  }
  return result;
}

// ===== CSV Parser =====
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let cur = '', inQ = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') { inQ = true; }
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\r' || c === '\n') {
      row.push(cur); cur = '';
      if (row.some(x => x.trim())) rows.push(row);
      row = [];
      if (c === '\r' && text[i+1] === '\n') i++;
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); if (row.some(x => x.trim())) rows.push(row); }
  return rows;
}
function csvToObjects(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0];
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i] || '');
    return obj;
  });
}

// ===== JSON Extractor =====
function extractJSON(text) {
  if (!text) return null;
  try { return JSON.parse(text); } catch(e) {}
  const m1 = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m1) try { return JSON.parse(m1[1].trim()); } catch(e) {}
  const m2 = text.match(/(\{[\s\S]*\})/);
  if (m2) try { return JSON.parse(m2[1]); } catch(e) {}
  return null;
}

}

async function startExperiment() {
  const combos = getSelectedCombos();
  if (!combos.length) { toast('请至少选择一个模型×Prompt组合', 'error'); return; }
  if (!state.questions.length) { toast('请先加载数据', 'error'); return; }
  state.running = true;
  document.getElementById('btn-run').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('progress-card').style.display = 'block';
  const delay = parseInt(document.getElementById('run-delay').value) || 500;
  const timeout = parseInt(document.getElementById('run-timeout').value) || 60000;
  const maxRetry = Math.max(0, parseInt(document.getElementById('run-retry').value) || 0);
  const maxConcurrency = Math.max(1, parseInt(document.getElementById('run-concurrency').value) || 4);
  let total = combos.length * state.questions.length;
  let done = { count: 0 };
  addLog('info', '实验', `开始运行: ${combos.length}个组合, 并发${maxConcurrency}, ${state.questions.length}题/组合, 共${total}次调用`);

  // Semaphore: limit concurrent API calls
  let running = 0;
  const waitQueue = [];
  function acquire() {
    return new Promise(resolve => {
      if (running < maxConcurrency) { running++; resolve(); }
      else waitQueue.push(resolve);
    });
  }
  function release() {
    running--;
    if (waitQueue.length) { running++; waitQueue.shift()(); }
  }

  const tasks = combos.flatMap(combo => {
    const model = state.models.find(m => m.id === combo.modelId);
    const prompt = state.prompts.find(p => p.id === combo.promptId);
    if (!model || !prompt) return [];

    const keys = model.apiKeys || (model.apiKey ? [model.apiKey] : []);
    const keyCount = Math.max(1, keys.length);

    // Split questions evenly across keys
    const questionGroups = Array.from({ length: keyCount }, () => []);
    state.questions.forEach((q, qi) => {
      questionGroups[qi % keyCount].push({ q, qi });
    });

    return questionGroups.map((group, ki) => (async () => {
      for (const { q, qi } of group) {
        if (!state.running) break;
        const promptType = state.typeMap[q.question_type] || 'judge';
        if (prompt.type !== promptType) { done.count++; updateProgress(done.count, total, `${model.name} × ${prompt.name} - 跳过`); continue; }
        let content = buildPromptContent(prompt.content, q);
        let response = null, attempts = 0;
        await acquire();
        try {
          while (attempts <= maxRetry && !response) {
            attempts++;
            try {
              updateProgress(done.count, total, `调用 ${model.name}(K${ki+1}) × ${prompt.name} - 试卷${q.paper_id}题${q.question_id}`);
              response = await callModelAPI(model, content, timeout, ki);
            } catch(err) {
              addLog('error', 'API', `${model.name}(K${ki+1}) 调用失败(${attempts}/${maxRetry+1}): ${err.message}`);
              if (attempts > maxRetry) response = null;
            }
          }
        } finally { release(); }
        const evaluation = evaluateResponse(response, q, prompt.type);
        const existing = state.results.findIndex(r => r.modelId === combo.modelId && r.promptId === combo.promptId && r.questionIndex === qi);
        const resultObj = {
          modelId: combo.modelId, promptId: combo.promptId, questionIndex: qi,
          paperId: q.paper_id, questionId: q.question_id, questionType: q.question_type,
          modelResponse: response, evaluation, timestamp: now()
        };
        if (existing >= 0) state.results[existing] = resultObj;
        else state.results.push(resultObj);
        done.count++;
        updateProgress(done.count, total, `${model.name}(K${ki+1}) × ${prompt.name} - ${done.count}/${total}`);
        if (delay > 0) await sleep(delay);
      }
    })());
  });

  await Promise.all(tasks);
  state.running = false;
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  saveState();
  addLog('success', '实验', `实验完成: ${done.count}/${total} 次调用`);
  toast(`实验完成！共处理 ${done.count} 次`, 'success');
}
function stopExperiment() {
  state.running = false;
  document.getElementById('btn-run').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  addLog('warn', '实验', '用户手动停止实验');
  toast('实验已停止', 'info');

function updateProgress(done, total, detail) {
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done}/${total} (${pct}%)`;
  document.getElementById('progress-detail').textContent = detail || '';
}
async function callModelAPI(model, content, timeout, keyIndex = 0) {
  const keys = model.apiKeys || (model.apiKey ? [model.apiKey] : []);
  const apiKey = keys[keyIndex % keys.length] || '';
  const proxyUrl = `${window.location.origin}/api/call`;
  const max429Retries = 5;
  for (let attempt = 0; attempt <= max429Retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), (timeout || 60000) + 5000);
    try {
      const resp = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          targetUrl: model.apiUrl,
          apiKey: apiKey,
          body: { model: model.modelId, messages: [{ role: 'user', content }], temperature: 0 },
          timeout: Math.ceil((timeout || 60000) / 1000)
        }),
        signal: controller.signal
      });
      clearTimeout(timer);
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Response parse error: ' + text.slice(0, 200)); }

      // Handle 429 rate limit with exponential backoff
      if (data.status === 429 && attempt < max429Retries) {
        const retryAfter = data.retryAfter || parseInt(resp.headers.get('X-RateLimit-RetryAfter')) || 0;
        const wait = retryAfter > 0 ? retryAfter * 1000 : Math.min(2000 * Math.pow(2, attempt), 30000);
        addLog('warn', 'API', `${model.name}(K${keyIndex+1}) 限流429，等待${(wait/1000).toFixed(1)}s后重试(${attempt+1}/${max429Retries})`);
        await sleep(wait);
        continue;
      }

      if (!resp.ok || data.proxyError) {
        throw new Error(`HTTP ${data.status || resp.status}: ${(data.body || '').slice(0, 200)}`);
      }
      return data.choices?.[0]?.message?.content || data.response || data.result || JSON.stringify(data);
    } catch(e) {
      clearTimeout(timer);
      // Don't retry on non-429 errors
      throw e;
    }
  }
  throw new Error(`HTTP 429: 限流重试${max429Retries}次后仍失败`);
}
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== Evaluation =====
function evaluateResponse(responseText, question, promptType) {
  if (!responseText) return { judgmentCorrect: null, modelResult: null, groundTruth: question.is_right === 'TRUE', tag: 'API调用失败，无响应' };
  const groundTruth = question.is_right === 'TRUE';
  const data = extractJSON(responseText);
  if (!data) return { judgmentCorrect: null, modelResult: null, groundTruth, tag: '模型输出非JSON', rawResponse: responseText.slice(0, 200) };

  let modelJudgment = null, tag = '';

  // --- Format: {"批改结果": "正确/错误/部分正确", "错误标签": [...], "错误步骤": [...]} ---
  if (data['批改结果'] !== undefined) {
    const r = data['批改结果'];
    modelJudgment = r === '正确' ? true : false; // "部分正确" and "错误" both = not fully correct
    if (Array.isArray(data['错误标签']) && data['错误标签'].length) tag = data['错误标签'].join(', ');
    if (Array.isArray(data['错误步骤']) && data['错误步骤'].length) tag += (tag ? ' | ' : '') + data['错误步骤'].join('; ').slice(0, 100);
    if (data['过程评价']) tag = data['过程评价'].slice(0, 120);
  }
  // --- Format: {"overall_judgment": "correct/incorrect", "steps": [...]} ---
  else if (data['overall_judgment'] !== undefined) {
    const r = data['overall_judgment'];
    modelJudgment = r === 'correct';
    if (Array.isArray(data['steps'])) {
      const errs = data['steps'].filter(s => s.judgment !== 'correct');
      tag = errs.map(s => (s.errors || []).map(e => e.label || e.location || '').filter(Boolean).join(',') || s.judgment).join('; ').slice(0, 120);
    }
  }
  // --- Format: {"overall_result": "正确/部分正确/错误", "step_analysis": [...]} ---
  else if (data['overall_result'] !== undefined) {
    const r = data['overall_result'];
    modelJudgment = r === '正确' ? true : false;
    if (Array.isArray(data['step_analysis'])) {
      const errs = data['step_analysis'].filter(s => s.judge && s.judge !== '正确');
      tag = errs.map(s => [s.error_tag, s.error_detail].filter(Boolean).join(': ')).join('; ').slice(0, 120);
    }
    if (data['teacher_feedback']) tag += (tag ? ' | ' : '') + data['teacher_feedback'].slice(0, 60);
  }
  // --- Format: {"overall_verdict": "正确/部分正确/错误", "step_analysis": [...], "final_answer_check": "..."} ---
  else if (data['overall_verdict'] !== undefined) {
    const r = data['overall_verdict'];
    modelJudgment = r === '正确' ? true : false;
    if (Array.isArray(data['step_analysis'])) {
      const errs = data['step_analysis'].filter(s => s.verdict && s.verdict !== '正确');
      tag = errs.map(s => (s.error_tags || []).concat(s.teacher_comment ? [s.teacher_comment] : []).join(', ')).join('; ').slice(0, 120);
    }
    if (data['grading_feedback']) tag += (tag ? ' | ' : '') + data['grading_feedback'].slice(0, 60);
  }
  // --- Legacy: {"AllCorrect": true/false} ---
  else if (typeof data.AllCorrect === 'boolean') {
    modelJudgment = data.AllCorrect;
    if (data.ErrorType) tag = data.ErrorType;
    if (data.Correction) tag += (tag ? ' | ' : '') + data.Correction.slice(0, 80);
  }
  // --- Legacy: {"ResultIsCorrect": "yes/no"} ---
  else if (typeof data.ResultIsCorrect === 'string') {
    modelJudgment = data.ResultIsCorrect === 'yes';
    if (Array.isArray(data.Questions)) {
      tag = data.Questions.filter(q => q.Correction).map(q => q.Correction).join('; ').slice(0, 120);
    }
  }

  if (modelJudgment === null) {
    // Dump all keys for debugging
    const keys = Object.keys(data).join(', ');
    return { judgmentCorrect: null, modelResult: null, groundTruth, tag: `无法识别输出格式 (字段: ${keys})`, rawData: data };
  }

  const judgmentCorrect = modelJudgment === groundTruth;
  if (!judgmentCorrect) {
    const prefix = groundTruth ? '误判: 将正确答案判为错误(FN)' : '误判: 将错误答案判为正确(FP)';
    tag = prefix + (tag ? ' | ' + tag : '');
  }
  return { judgmentCorrect, modelResult: modelJudgment, groundTruth, tag, rawData: data };
}

function getResultForCell(modelId, promptId, questionIndex) {

function renderResultsStats() {
  const el = document.getElementById('results-stats');
  const combos = [...new Set(state.results.map(r => `${r.modelId}_${r.promptId}`))];
  let html = '';
  combos.forEach(key => {
    const [mid, pid] = [state.results.find(r => `${r.modelId}_${r.promptId}` === key)?.modelId, state.results.find(r => `${r.modelId}_${r.promptId}` === key)?.promptId];
    const model = state.models.find(m => m.id === mid);
    const prompt = state.prompts.find(p => p.id === pid);
    if (!model || !prompt) return;
    const results = state.results.filter(r => r.modelId === mid && r.promptId === pid);
    const evaluated = results.filter(r => r.evaluation?.judgmentCorrect !== null && r.evaluation?.judgmentCorrect !== undefined);
    const correct = evaluated.filter(r => r.evaluation.judgmentCorrect === true).length;
    const pct = evaluated.length ? Math.round(correct / evaluated.length * 100) : 0;
    const color = pct >= 80 ? 'var(--success)' : pct >= 60 ? 'var(--warning)' : 'var(--danger)';
    html += `<div class="stat-item"><div class="label">${model.name} × ${prompt.name}</div><div class="value" style="color:${color}">${pct}%</div><div style="font-size:11px;color:var(--gray-500);">${correct}/${evaluated.length} 正确</div></div>`;
  });
  el.innerHTML = html || '<div class="empty-state"><p>暂无结果数据</p></div>';

  }

    else byType[r.questionType].fail++;
  });
  el.innerHTML = Object.entries(byType).map(([t, s]) => {
    const pct = (s.correct + s.wrong) ? Math.round(s.correct / (s.correct + s.wrong) * 100) : 0;
    const color = pct >= 80 ? 'var(--success)' : pct >= 60 ? 'var(--warning)' : 'var(--danger)';
    return `<div class="accuracy-bar"><span class="lbl">${t||'(未知)'}</span><div class="bar"><div class="fill" style="width:${pct}%;background:${color};"></div></div><span class="pct" style="color:${color}">${pct}%</span></div>
    <div style="font-size:11px;color:var(--gray-500);margin-bottom:8px;">正确${s.correct} / 错判${s.wrong} / 解析失败${s.fail}</div>`;
  }).join('');
}

// ===== Export =====
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportResultsCSV() {
  if (!state.results.length) { toast('暂无结果', 'error'); return; }
  const comboKeys = [...new Set(state.results.map(r => `${r.modelId}|${r.promptId}`))];
  const combos = comboKeys.map(k => { const [m,p] = k.split('|'); return { modelId: m, promptId: p }; });
  // Header
  let header = ['序号','试卷','题号','题型','GroundTruth'];
  combos.forEach(c => {
    const m = state.models.find(x=>x.id===c.modelId); const p = state.prompts.find(x=>x.id===c.promptId);
    header.push(`${m?.name||'?'}×${p?.name||'?'} 判题`, `${m?.name||'?'}×${p?.name||'?'} Tag`);
  });
  let rows = [header.join(',')];
  state.questions.forEach((q, qi) => {
    let row = [qi+1, q.paper_id, q.question_id, q.question_type, q.is_right];
    combos.forEach(c => {
      const r = getResultForCell(c.modelId, c.promptId, qi);
      if (r?.evaluation) {
        row.push(r.evaluation.judgmentCorrect === true ? 'True' : r.evaluation.judgmentCorrect === false ? 'False' : 'ParseError');
        row.push('"' + (r.evaluation.tag || '').replace(/"/g, '""') + '"');
      } else { row.push('', ''); }
    });
    rows.push(row.join(','));
  });
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, `实验结果_${Date.now()}.csv`);
  toast('CSV已导出', 'success');
}
function exportSummaryCSV() {
  if (!state.results.length) { toast('暂无结果', 'error'); return; }
  // Format matching 数学总结.csv: paper_id, question_id, question_type, then 判题是否正确 for each model, then tag for each model
  const modelIds = [...new Set(state.results.map(r => r.modelId))];
  // Row 1: merged header
  let row1 = ['','','','判题是否正确',...Array(modelIds.length-1).fill(''),...Array(modelIds.length).fill('输出的tag'),...Array(Math.max(0,12-modelIds.length*2)).fill('')];
  let row2 = ['paper_id','question_id','question_type',...modelIds.map(id => state.models.find(m=>m.id===id)?.name||'?'),...modelIds.map(id => state.models.find(m=>m.id===id)?.name||'?'),...Array(Math.max(0,12-modelIds.length*2)).fill('')];
  let csvRows = [row1.join(','), row2.join(',')];
  state.questions.forEach((q, qi) => {
    let row = [q.paper_id, q.question_id, q.question_type];
    // 判题是否正确
    modelIds.forEach(mid => {
      // Find any result for this question across all prompts for this model
      const results = state.results.filter(r => r.modelId === mid && r.questionIndex === qi);
      const best = results.find(r => r.evaluation?.judgmentCorrect !== null) || results[0];
      if (best?.evaluation?.judgmentCorrect === true) row.push('True');
      else if (best?.evaluation?.judgmentCorrect === false) row.push('False');
      else row.push('');
    });
    // tag
    modelIds.forEach(mid => {
      const results = state.results.filter(r => r.modelId === mid && r.questionIndex === qi);
      const best = results.find(r => r.evaluation?.tag) || results[0];
      row.push('"' + (best?.evaluation?.tag || '').replace(/"/g, '""') + '"');
    });
    // pad
    for (let i = row.length; i < row2.length; i++) row.push('');
    csvRows.push(row.join(','));
  });
  const blob = new Blob(['﻿' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, `总结表_${Date.now()}.csv`);
  toast('总结表CSV已导出', 'success');
}
function exportResultsJSON() {
  if (!state.results.length) { toast('暂无结果', 'error'); return; }
  const exportData = state.results.map(r => {
    const m = state.models.find(x=>x.id===r.modelId);
    const p = state.prompts.find(x=>x.id===r.promptId);
    return { ...r, modelName: m?.name, promptName: p?.name, promptType: p?.type };
  });
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `实验结果_${Date.now()}.json`);
  toast('JSON已导出', 'success');
}
function clearResults() {
  if (confirm('确定清除所有实验结果？此操作不可恢复。')) {
    state.results = [];
    saveState(); renderResults();
    addLog('warn', '结果', '用户清除所有结果');
    toast('结果已清除', 'info');
  }
}

// ===== Init =====
function init() {
  loadSavedState().then(() => {
    renderConfig();
    addLog('info', '系统', '工具已初始化，配置已从本地文件加载');
  });
  checkServerStatus();
}
async function checkServerStatus() {
  const el = document.getElementById('server-status');
  try {
    const r = await fetch(`${window.location.origin}/api/status`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      el.innerHTML = '<span class="dot on"></span><span>代理服务已连接</span>';
    } else throw 0;
  } catch(e) {
    el.innerHTML = '<span class="dot off"></span><span>代理服务未连接 — 请运行 python3 server.py</span>';
  }
}
window.addEventListener('DOMContentLoaded', init);
</script>
